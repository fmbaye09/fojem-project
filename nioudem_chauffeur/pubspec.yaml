name: fojem_chauffeur
description: FOJËM Chauffeur — application chauffeur du covoiturage interurbain au Sénégal
publish_to: 'none'
version: 1.4.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.3.3
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  go_router: ^13.0.0
  provider: ^6.0.0
  intl: ^0.20.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  qr_flutter: ^4.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.2.2
  mobile_scanner: ^7.4.2
  flutter_local_notifications: ^22.3.2
  geolocator: ^13.0.2
  record: ^7.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
