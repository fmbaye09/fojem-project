org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Le projet (D:) et le cache Pub (C:) sont sur deux lecteurs : la compilation
# Kotlin incrémentale échoue sur les plugins puis recompile tout. On la
# désactive pour éviter cet aller-retour, et on réutilise le cache Gradle.
kotlin.incremental=false
org.gradle.caching=true
